<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: cabecalho('Nova senha')}"></head>
<body>

<div class="tela-login">
    <div class="caixa-login">
        <div class="marca-login">Porta<span>ria</span></div>
        <p class="lema">Escolha uma senha nova</p>

        <div class="cartao">

            <div th:if="${erroToken}">
                <div class="aviso" th:text="${erroToken}"></div>
                <p class="dica" style="text-align:center">
                    <a th:href="@{/recuperar-senha}">Pedir um novo link</a>
                </p>
            </div>

            <form th:unless="${erroToken}" th:action="@{/redefinir-senha}"
                  th:object="${formulario}" method="post">
                <input type="hidden" th:field="*{token}">
                <div class="campo">
                    <label for="novaSenha">Nova senha</label>
                    <input type="password" id="novaSenha" th:field="*{novaSenha}"
                           autocomplete="new-password" autofocus>
                    <div class="erro-campo" th:if="${#fields.hasErrors('novaSenha')}"
                         th:errors="*{novaSenha}"></div>
                </div>
                <div class="campo">
                    <label for="confirmacao">Repita a nova senha</label>
                    <input type="password" id="confirmacao" th:field="*{confirmacao}"
                           autocomplete="new-password">
                    <div class="erro-campo" th:if="${#fields.hasErrors('confirmacao')}"
                         th:errors="*{confirmacao}"></div>
                </div>
                <button type="submit" style="width:100%">Definir nova senha</button>
                <p class="dica">Este link vale uma única vez e expira em 30 minutos.</p>
            </form>
        </div>
    </div>
</div>

</body>
</html>
