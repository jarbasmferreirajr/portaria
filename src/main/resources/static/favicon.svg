<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Portaria">
    <!-- Mesma cancela do símbolo da marca, com fundo próprio porque o
         ícone da aba aparece sobre o cinza claro do navegador. As cores
         estão escritas aqui porque um .svg servido como ícone não
         enxerga as fichas da folha de estilo. -->
    <rect width="48" height="48" rx="10" fill="#0C0E11"/>
    <g transform="translate(4.3 4.3) scale(0.82)">
        <rect x="6" y="12" width="7" height="30" rx="2" fill="#FFB224"/>
        <rect x="4" y="40" width="40" height="4" rx="2" fill="#E9EBEE"/>
        <g transform="rotate(-32 16 18)">
            <rect x="12" y="14" width="34" height="7" rx="2" fill="#E9EBEE"/>
        </g>
        <rect x="34" y="4" width="8" height="8" rx="2" fill="#FFB224"/>
    </g>
</svg>
