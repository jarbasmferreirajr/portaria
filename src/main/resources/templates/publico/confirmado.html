<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: cabecalho('Inscrição confirmada')}"></head>
<body>

<header th:replace="~{layout :: topo-publico}"></header>

<div class="container-estreito" id="conteudo">
    <h1>Inscrição confirmada</h1>
    <p class="sub">
        <span th:text="${inscricao.nome}">Nome</span>, sua vaga em
        <strong th:text="${evento.nome}">evento</strong> está garantida.
    </p>

    <div class="cartao">
        <p class="rotulo centro sem-margem-topo">
            Seu código de entrada
        </p>
        <div class="codigo codigo-grande" th:text="${inscricao.codigo}">ABC123</div>
        <p class="apoio centro">
            Apresente este código na portaria.<br>
            Tire um print desta tela — ele funciona mesmo sem sinal de celular.
        </p>
    </div>

    <div class="cartao">
        <h2>Detalhes do evento</h2>
        <p class="sem-margem">
            <span th:text="${evento.local}">Local</span><br>
            <span th:text="${#temporals.format(evento.inicio, 'dd/MM/yyyy ''às'' HH:mm')}">data</span>
        </p>
    </div>
</div>

</body>
</html>
