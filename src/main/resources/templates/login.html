<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{layout :: cabecalho('Entrar')}"></head>
<body>

<div class="tela-login">
    <div class="caixa-login">
        <div class="marca-login">
            <svg th:replace="~{layout :: simbolo}"></svg>
            <span class="palavra">Porta<span>ria</span></span>
        </div>
        <p class="lema">Controle de entrada para eventos presenciais</p>

        <div class="cartao">
            <div class="aviso" th:if="${param.error}">
                Usuário ou senha inválidos.
            </div>
            <div class="aviso ok" th:if="${param.senhaRedefinida}">
                Senha redefinida. Entre com a senha nova.
            </div>
            <div class="aviso ok" th:if="${param.senhaAlterada}">
                Senha alterada. Entre novamente com a nova senha.
            </div>
            <div class="aviso ok" th:if="${param.emailAlterado}">
                E-mail alterado. Entre novamente com o endereço novo.
            </div>
            <div class="aviso ok" th:if="${param.saiu}">
                Sessão encerrada com segurança.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="username">E-mail</label>
                    <input type="email" id="username" name="username" autocomplete="username"
                           placeholder="voce@exemplo.com" autofocus required>
                </div>
                <div class="campo">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="botao-largo">Entrar</button>
                <p class="dica centro">
                    <a th:href="@{/recuperar-senha}">Esqueci minha senha</a>
                </p>
            </form>
        </div>
    </div>
</div>

</body>
</html>
