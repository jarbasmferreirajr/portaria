# Perfil de desenvolvimento e de apresentacao.
#
# H2 em arquivo: sobrevive a reinicios, nao exige nada instalado e roda sem
# rede. E o banco com que o projeto nasceu, e segue sendo o caminho mais
# curto entre clonar o repositorio e ver o sistema funcionando.

spring.datasource.url=jdbc:h2:file:./data/portaria;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 para inspecionar os dados durante a apresentacao: /h2-console
#
# As excecoes de seguranca que o console exige (CSRF ignorado nessa rota e
# X-Frame-Options em SAMEORIGIN) estao amarradas a ESTA propriedade, nao ao
# nome do perfil -- ver ConfiguracaoSeguranca. Desligar o console aqui ja
# devolve a aplicacao ao estado integro.
spring.h2.console.enabled=true
