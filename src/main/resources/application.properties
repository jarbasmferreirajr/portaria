# As chaves abaixo pertencem ao Spring Boot: sao vocabulario reservado
# e nao podem ser traduzidas. Os comentarios explicam cada bloco.

spring.application.name=portaria

# Banco H2 em arquivo: sobrevive a reinicios e nao exige instalacao.
# Para migrar ao PostgreSQL, troque as quatro linhas abaixo (ver README).
spring.datasource.url=jdbc:h2:file:./data/portaria;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O esquema e criado exclusivamente pelas migracoes do Flyway.
# O Hibernate apenas confere se as entidades batem com o que existe no banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Console do H2 para inspecionar os dados durante a apresentacao: /h2-console
spring.h2.console.enabled=true

server.port=8080
