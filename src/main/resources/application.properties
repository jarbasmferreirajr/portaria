# As chaves abaixo pertencem ao Spring Boot: sao vocabulario reservado
# e nao podem ser traduzidas. Os comentarios explicam cada bloco.
#
# Este arquivo guarda o que vale em QUALQUER ambiente. O banco fica nos
# arquivos por perfil, ao lado deste:
#
#   application-dev.properties       H2 em arquivo. Padrao. Nao exige nada
#                                    instalado e roda sem rede -- e o perfil
#                                    do desenvolvimento e da apresentacao.
#   application-postgres.properties  PostgreSQL. Mesmas migracoes, mesmo
#                                    codigo; so muda a conexao.
#
# Para subir no PostgreSQL:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# Em producao o perfil vem do ambiente (SPRING_PROFILES_ACTIVE=postgres),
# junto com as credenciais -- que nunca ficam no repositorio.

spring.application.name=portaria

spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# O esquema e criado exclusivamente pelas migracoes do Flyway.
# O Hibernate apenas confere se as entidades batem com o que existe no banco.
# Isto vale nos dois bancos, e e o que prova que as migracoes sao portaveis:
# se o esquema criado no PostgreSQL nao batesse com as entidades, a aplicacao
# nao subiria.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

server.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Entrega de e-mail (recuperacao de senha, convite, comprovante de inscricao)
#
#   log  -> escreve a mensagem no log da aplicacao. Padrao. Sem rede.
#   smtp -> envia de verdade. Para ver o e-mail chegando SEM internet, suba um
#           Mailpit local e descomente o bloco abaixo:
#
#             docker run -d -p 1025:1025 -p 8025:8025 axllent/mailpit
#             caixa de entrada: http://localhost:8025
# ---------------------------------------------------------------------------
portaria.email.modo=${PORTARIA_EMAIL_MODO:log}

