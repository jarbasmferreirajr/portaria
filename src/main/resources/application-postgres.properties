# Perfil PostgreSQL.
#
# Nenhuma migracao foi reescrita para chegar ate aqui: as sete estao em SQL
# padrao desde a primeira sprint, justamente para que a troca de banco fosse
# uma troca de configuracao. O ddl-auto=validate, herdado do arquivo comum, e
# o juiz -- se o esquema que o Flyway cria no PostgreSQL nao batesse com as
# entidades, a aplicacao nao subiria.
#
# COMO SUBIR O BANCO LOCALMENTE
#
# Sao tres caminhos, descritos no README em "Subir o PostgreSQL local". O
# usado no desenvolvimento deste projeto e o primeiro: um cluster proprio
# dentro da pasta do usuario, iniciado a mao com pg_ctl -- nao depende de
# servico do Windows nem de Docker.
#
# Em qualquer um deles o banco pode subir vazio: o Flyway cria o esquema
# inteiro da V1 a V7 na primeira execucao.
#
# Depois:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# No PowerShell esse argumento costuma ser quebrado ao meio. Use aspas em
# volta dele, ou a variavel de ambiente:
#   $env:SPRING_PROFILES_ACTIVE = "postgres"
#
# CREDENCIAIS
#
# Os valores abaixo sao os do banco LOCAL de desenvolvimento, e por isso
# podem viver no repositorio. Em producao nada disso se aplica: o provedor
# injeta SPRING_DATASOURCE_URL, _USERNAME e _PASSWORD no ambiente, e os
# valores do arquivo nem chegam a ser lidos. Senha de producao em arquivo
# versionado e vazamento, nao configuracao.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portaria}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:portaria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:portaria}

# O driver e o dialeto sao detectados pela URL. Declarar o dialeto a mao e
# fonte classica de erro quando a versao do banco muda.

# Sem console: ele e do H2. A ausencia desta propriedade tambem devolve o
# CSRF e o X-Frame-Options ao estado integro -- ver ConfiguracaoSeguranca.
